name: flux
description: "Flux — a cross-platform VLESS/VPN client."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.4.0+5

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  # Локализации для WidgetsApp (PortApp) — TextField внутри PortInput
  # требует MaterialLocalizations в дереве (см. docs/shadcn/PLAN.md).
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # State management, связывает UI с CoreEngine/EngineManager
  flutter_riverpod: ^3.3.2

  # Генерация id для узлов Magic JSON (ProxyNode/ConnectionVariant/...)
  uuid: ^4.6.0

  # Скачивание тела подписки по URL
  http: ^1.6.0

  # Растровые флаги — Windows не умеет рисовать flag-эмодзи как картинку
  # (Segoe UI Emoji их не поддерживает), поэтому эмодзи-флаг из иконки
  # рендерим этим пакетом вместо голого текста.
  country_flags: ^4.1.2

  # Фреймлесс-окно на Windows + кастомный тайтлбар вместо системного (см.
  # PLAN.md, "UI-стек")
  window_manager: ^0.5.2

  # Иконки — те же, что на сайте shadcn/ui. Раньше приходил транзитивно
  # через shadcn_ui (см. docs/shadcn/PLAN.md — вместо shadcn_ui теперь
  # lib/widgets/port_ui/, собственный порт).
  lucide_icons_flutter: ^3.0.0

  # Запись системного прокси Windows в реестр (см. windows_system_proxy.dart)
  win32_registry: ^3.0.3

  # Прямые вызовы Win32 API — Job Object для дочернего xray.exe и запрос
  # прав администратора для TUN (см. child_process_job.dart,
  # windows_elevation.dart)
  win32: ^6.3.0
  ffi: ^2.1.4
  google_fonts: ^8.2.0

  # Иконка в системном трее + меню (см. ROADMAP.md, трек 7)
  tray_manager: ^0.5.3
  package_info_plus: ^10.2.1

  # Системные Windows-уведомления при подключении/отключении (см.
  # ROADMAP.md, трек 25) — тот же издатель (leanflutter), что и
  # tray_manager/window_manager выше.
  local_notifier: ^0.1.6

  # Свой видеофон (HomeBackground.customVideo) — юзер подсовывает
  # произвольный видеофайл, он копируется в аппдату и крутится в лупе.
  # video_player закрывает Android/iOS, video_player_win — Windows через
  # Media Foundation (без нативных бинарников в отличие от media_kit —
  # решили не тащить libmpv/FFmpeg ради размера инсталлятора).
  video_player: ^2.13.0
  video_player_win: ^3.2.2

  # Выбор видеофайла системным диалогом. Версии file_picker 8.0.6–11.x
  # зависят от win32 ^5.x, конфликтуют с нашим win32 ^6.3.0 (job
  # object/elevation, см. child_process_job.dart) — только 12.x (пока beta)
  # совместим.
  file_picker: ">=12.0.0-beta.1 <13.0.0"

  # Каталог для копии выбранного видеофайла — кроссплатформенно, в отличие
  # от `app_paths.dart` (там хардкод под %APPDATA%, Windows-only).
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Генерирует android/app/src/main/res/mipmap-*/ic_launcher.png из
  # assets/icon.png и macos/Runner/Assets.xcassets/AppIcon.appiconset/*.png
  # из docs/media/icon_with_black.png (см. `flutter_icons:` ниже) —
  # запускается вручную (`dart run flutter_launcher_icons`), не на каждой
  # сборке. Windows-иконку это не трогает (там свой .ico, см.
  # windows/runner/resources). macOS использует отдельный source-файл с
  # фоном/скруглением — Apple ожидает непрозрачную заливку до краёв
  # (см. README пакета), а assets/icon.png прозрачный контур-логотип, из
  # него выходит "голый" контур без фона.
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  macos:
    generate: true
    image_path: "docs/media/icon_with_black.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  assets:
    - assets/globe/land_mask.png
    - assets/icon.png
    - assets/tray_icon.ico
    - assets/tray_icon_proxy.ico
    - assets/tray_icon_tun.ico
    - assets/tray_icon_macos.png
    - assets/tray_icon_proxy_macos.png
    - assets/tray_icon_tun_macos.png

  shaders:
    - shaders/color_bends.frag
    - shaders/simple_gradient.frag
    - shaders/galaxy.frag

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
